spring.application.name=expense-tracker-api

# --- H2 In-Memory Database Configuration ---
spring.datasource.url=jdbc:h2:mem:expensedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Enable the Web Browser H2 Console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate Settings ---
# Automatically create/update database tables based on our @Entity
spring.jpa.hibernate.ddl-auto=update
# Print SQL queries in the console so we can see what Hibernate is doing
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true